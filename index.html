<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Status Checker</title>
    <link rel="icon" sizes="16x16" type="image/png" href="images/wireless.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        <img src="images/internet.svg" class="header-img" alt="Internet Icon">
        <h1 class="header-title">Internet Connection Status Detector</h1>
        <p class="subtitle">Instantly check your connection, public IP, and network strength</p>
    </div>


    <div class="container">
        <div class="status">
            <h2 class="status-title">Connection Details</h2>
            <p><strong>Connection Status: </strong><span id="statusText">Checking....</span></p>
            <p><strong>IP Address: </strong><span id="ipAddressText">-</span></p>
            <p><strong>Network Strength: </strong><span id="strengthText">-</span></p>
        </div>
        <div class="btn-center">
            <button id="refreshBtn">Check Again</button>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
